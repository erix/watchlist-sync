<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist Sync</title>
  {% if busy %}<meta http-equiv="refresh" content="5">{% endif %}
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #fff;
            --accent: #2563eb; --warn-bg: #fef3c7; --warn-fg: #92400e; --bad: #b91c1c; --good: #15803d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --card: #292524;
              --accent: #60a5fa; --warn-bg: #451a03; --warn-fg: #fcd34d; --bad: #f87171; --good: #4ade80; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    header { border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
    header strong { margin-right: 8px; }
    nav a { color: var(--fg); margin-right: 14px; text-decoration: none; }
    nav a:hover { color: var(--accent); }
    main { max-width: 1040px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .muted { color: var(--muted); }
    .warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
    .bad { color: var(--bad); } .good { color: var(--good); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; }
    .scroll { overflow-x: auto; }
    form.inline { display: inline; }
    button, .button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input, select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  </style>
</head>
<body>
<header>
  <strong>Watchlist Sync</strong>
  <nav>
    <a href="/">Status</a><a href="/watchlist">Watchlist</a><a href="/unmatched">Unmatched</a>
    <a href="/conflicts">Conflicts</a><a href="/log">Change log</a>
  </nav>
  {% if busy %}<span class="muted">Sync running…</span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
