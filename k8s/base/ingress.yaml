apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watchlist-sync
  namespace: watchlist-sync
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - watchlists.erix-homelab.site
      secretName: watchlist-sync-tls
  rules:
    - host: watchlists.erix-homelab.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: watchlist-sync
                port:
                  number: 8080
