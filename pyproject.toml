[project]
name = "watchlist-sync"
version = "0.1.0"
description = "Keep a watchlist in sync across Trakt and Simkl"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchlist_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
